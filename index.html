<h1>JARVIS</h1>
<p>JARVIS is a personal, self-hosted desktop assistant that runs on its owner's own computer. It can read the owner's Gmail and Google Calendar to give a daily briefing and new-mail alerts.</p>
<p>It is built for private use by its developer and is not offered to the public.</p>
